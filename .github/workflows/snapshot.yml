name: daily-snapshot
on:
  schedule: [{ cron: "15 12 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci && npm run snapshot && node scripts/rollup.mjs
      - run: |
          git config user.name "cpi-bot"; git config user.email "cpi-bot@users.noreply.github.com"
          git add data && git commit -m "data: daily snapshot" || echo "no change"
          git push
